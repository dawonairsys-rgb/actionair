<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>액션에어 · 다원에어시스 — 도구 모음</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Pretendard',sans-serif;background:#0F1115;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;width:100%;}
  .top{text-align:center;margin-bottom:30px;}
  .top .eb{font-size:13px;font-weight:700;letter-spacing:.16em;color:#7FA3E6;}

  .top p{font-size:14px;color:#9AA0AA;margin-top:8px;}
  .card{display:block;text-decoration:none;border-radius:20px;padding:26px 24px;margin-bottom:16px;position:relative;overflow:hidden;transition:transform .15s;}
  .card:active{transform:scale(.99);}
  .card.blue{background:linear-gradient(135deg,#1A5FD4,#1247A6);}
  .card.red{background:linear-gradient(135deg,#A50034,#7E0027);}
  .card .tag{font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.85;color:#fff;}
  .card h2{font-size:22px;font-weight:800;color:#fff;margin-top:8px;letter-spacing:-.02em;}
  .card p{font-size:14px;color:rgba(255,255,255,.82);margin-top:8px;line-height:1.5;}
  .card .go{margin-top:16px;font-size:14px;font-weight:800;color:#fff;}
  footer{text-align:center;font-size:12px;color:#6B7280;margin-top:24px;line-height:1.7;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="eb">ACTIONAIR · 다원에어시스</div>
      <h1>고객용 도구 모음</h1>
      <p>아래에서 필요한 페이지로 이동하세요</p>
    </div>

    <a class="card blue" href="./simulator/">
      <div class="tag">히트펌프 · 액션에어</div>
      <h2>난방비 절감 시뮬레이터</h2>
      <p>면적·연료·난방비를 넣으면 히트펌프 전환 시 예상 절감액을 바로 계산합니다.</p>
      <div class="go">계산해보기 →</div>
    </a>

    <a class="card red" href="./landing/">
      <div class="tag">시스템에어컨 · 다원에어시스</div>
      <h2>여름 설치 캠페인</h2>
      <p>성수기 전 설치 안내 + 현장 실측 예약. LG전자 시스템에어컨 공식 인증점.</p>
      <div class="go">자세히 보기 →</div>
    </a>

    <footer>
      1555-7726 · 010-4854-2627<br>
      액션에어(히트펌프) · 다원에어시스(시스템에어컨)
    </footer>
  </div>
</body>
