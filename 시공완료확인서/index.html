<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다원에어시스 시공 현황</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic','맑은 고딕',sans-serif; background:#f0f2f5; color:#222; }

/* ── 로그인 ── */
#login-screen {
  position:fixed; inset:0; background:#1a2744;
  display:flex; align-items:center; justify-content:center; z-index:9999;
}
.login-box {
  background:#fff; border-radius:16px; padding:48px 40px;
  width:340px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4);
}
.login-box h1 { font-size:19px; color:#1a2744; margin-bottom:6px; }
.login-box p  { font-size:13px; color:#888; margin-bottom:26px; }
.login-box input {
  width:100%; padding:12px 16px; border:2px solid #ddd;
  border-radius:8px; font-size:15px; margin-bottom:12px;
  outline:none; letter-spacing:4px; text-align:center; font-family:inherit;
}
.login-box input:focus { border-color:#1a2744; }
.login-box button {
  width:100%; padding:13px; background:#1a2744; color:#fff;
  border:none; border-radius:8px; font-size:15px; cursor:pointer; font-family:inherit;
}
.login-box button:hover { background:#243660; }
#login-error { color:#e03; font-size:13px; margin-top:10px; display:none; }

/* ── 앱 ── */
#app { display:none; min-height:100vh; }

/* ── 헤더 ── */
header {
  background:#1a2744; color:#fff; padding:0 28px;
  display:flex; align-items:center; gap:0;
  position:sticky; top:0; z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.3); height:52px;
}
header .logo { font-size:16px; font-weight:700; margin-right:32px; white-space:nowrap; }
.nav-btn {
  height:52px; padding:0 20px; background:transparent; color:rgba(255,255,255,.65);
  border:none; border-bottom:3px solid transparent; cursor:pointer;
  font-size:14px; font-family:inherit; transition:.2s;
}
.nav-btn:hover  { color:#fff; }
.nav-btn.active { color:#fff; border-bottom-color:#60a5fa; }

/* ── 페이지 공통 ── */
.page { display:none; max-width:1380px; margin:0 auto; padding:28px 22px; }
.page.active { display:block; }

/* ── 주차 탭 ── */
.week-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
.wtab {
  padding:7px 15px; border-radius:20px; border:2px solid #d0d5e0;
  background:#fff; cursor:pointer; font-size:13px; font-family:inherit; transition:.15s;
}
.wtab:hover  { border-color:#1a2744; color:#1a2744; }
.wtab.active { background:#1a2744; color:#fff; border-color:#1a2744; }

/* ── 요약 카드 ── */
.summary-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px; margin-bottom:22px;
}
.card {
  background:#fff; border-radius:12px; padding:18px 20px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}
.card-label { font-size:12px; color:#888; margin-bottom:6px; }
.card-value { font-size:22px; font-weight:700; color:#1a2744; }
.card-value.green  { color:#2e7d32; }
.card-value.orange { color:#f57c00; }
.card-value.red    { color:#c62828; }

/* ── 섹션 ── */
.section {
  background:#fff; border-radius:12px; padding:22px;
  box-shadow:0 2px 8px rgba(0,0,0,.07); margin-bottom:20px;
}
.sec-title {
  font-size:14px; font-weight:700; color:#1a2744;
  margin-bottom:16px; padding-bottom:10px; border-bottom:2px solid #f0f2f5;
  display:flex; align-items:center; gap:8px;
}
.badge {
  font-size:11px; padding:2px 8px; border-radius:10px;
  background:#e8eaf6; color:#3949ab; font-weight:600;
}

/* ── 테이블 ── */
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th {
  background:#1a2744; color:#fff; padding:10px 8px;
  text-align:center; white-space:nowrap;
}
td { padding:8px 8px; border-bottom:1px solid #f0f2f5; vertical-align:middle; }
td.r { text-align:right; }
td.c { text-align:center; }
td.l { text-align:left; }
tr:hover td { background:#f8f9fc; }
tr.team-시공1팀  > td:first-child { border-left:3px solid #1565c0; }
tr.team-이엘이   > td:first-child { border-left:3px solid #2e7d32; }
tr.team-척척박사 > td:first-child { border-left:3px solid #f57f17; }
tr.team-취소됨   > td:first-child { border-left:3px solid #c62828; }
tr.team-KY공조  > td:first-child { border-left:3px solid #00838f; }
tr.team-류부원장 > td:first-child { border-left:3px solid #6a1b9a; }
tr.row-holiday { opacity:.4; }
.num { font-variant-numeric:tabular-nums; }
.tag {
  display:inline-block; padding:2px 7px; border-radius:4px;
  font-size:11px; font-weight:600;
}
.tag-미수 { background:#fff3e0; color:#e65100; }
.tag-완납 { background:#e8f5e9; color:#2e7d32; }
.tag-취소 { background:#fce4ec; color:#c62828; }

/* ── 알림 ── */
.alert-list { display:flex; flex-direction:column; gap:10px; }
.alert-item {
  display:flex; align-items:flex-start; gap:12px;
  padding:13px 15px; border-radius:8px; background:#fff8e1;
  border-left:4px solid #ffa000;
}
.alert-item.cancel { background:#fce4ec; border-color:#e91e63; }
.alert-item.info   { background:#e8f5e9; border-color:#43a047; }
.alert-icon { font-size:17px; flex-shrink:0; margin-top:1px; }
.alert-text { font-size:13px; line-height:1.65; }
.alert-text strong { display:block; font-size:13px; margin-bottom:2px; }

/* ── 특이사항 ── */
.bigo-list { display:flex; flex-direction:column; gap:8px; }
.bigo-item {
  padding:11px 14px; border-radius:8px; background:#f8f9fc;
  border-left:4px solid #1a2744; font-size:13px; line-height:1.6;
}
.bigo-item .bigo-who { font-weight:700; color:#1a2744; margin-bottom:3px; }
.bigo-item .bigo-memo { color:#444; }

.empty-msg { color:#aaa; font-size:13px; padding:8px 0; }
.updated { font-size:11px; color:#bbb; text-align:right; margin-top:12px; }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login-screen">
  <div class="login-box">
    <h1>🔒 다원에어시스</h1>
    <p>시공 현황 보고 페이지</p>
    <input type="password" id="pw-input" placeholder="비밀번호 입력"
           onkeydown="if(event.key==='Enter')tryLogin()">
    <button onclick="tryLogin()">입장</button>
    <div id="login-error">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- 앱 -->
<div id="app">
  <header>
    <div class="logo">📊 다원에어시스</div>
    <button class="nav-btn active" onclick="showPage('report')">보고 페이지</button>
    <button class="nav-btn"        onclick="showPage('all')">전체 내역</button>
  </header>

  <!-- ① 보고 페이지 -->
  <div class="page active" id="page-report">
    <div class="week-tabs" id="tabs-report"></div>

    <!-- 요약 카드 -->
    <div class="summary-grid" id="summary-cards"></div>

    <!-- 미수 -->
    <div class="section" id="sec-unpaid">
      <div class="sec-title">⚠️ 미수 건 현황 <span class="badge" id="cnt-unpaid">0건</span></div>
      <div class="alert-list" id="list-unpaid"></div>
    </div>

    <!-- 취소 -->
    <div class="section" id="sec-cancel">
      <div class="sec-title">🚫 취소 건 현황 <span class="badge" id="cnt-cancel">0건</span></div>
      <div class="alert-list" id="list-cancel"></div>
    </div>

    <!-- 특이사항 -->
    <div class="section" id="sec-bigo">
      <div class="sec-title">📌 특이사항 (비고) <span class="badge" id="cnt-bigo">0건</span></div>
      <div class="bigo-list" id="list-bigo"></div>
    </div>

    <!-- 주간 상세 테이블 -->
    <div class="section">
      <div class="sec-title">📋 주간 상세 내역 <span class="badge" id="cnt-report-table">0건</span></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>시공팀</th><th>거래처명</th><th>시공일자</th><th>실내기</th>
            <th>계약금액</th><th>제품대</th><th>인건비</th><th>도배비</th>
            <th>자재비</th><th>수 익</th><th>완납여부</th>
          </tr></thead>
          <tbody id="tbody-report"></tbody>
        </table>
      </div>
    </div>

    <div class="updated" id="updated-r"></div>
  </div>

  <!-- ② 전체 내역 -->
  <div class="page" id="page-all">
    <div class="week-tabs" id="tabs-all"></div>

    <!-- 상세 테이블 -->
    <div class="section">
      <div class="sec-title">📋 주간 상세 내역 <span class="badge" id="cnt-all">0건</span></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>시공팀</th><th>거래처명</th><th>시공일자</th><th>실내기</th>
            <th>계약금액</th><th>제품대</th><th>인건비</th><th>도배비</th>
            <th>자재비</th><th>수 익</th><th>완납여부</th>
          </tr></thead>
          <tbody id="tbody-all"></tbody>
        </table>
      </div>
    </div>

    <!-- 특이사항 -->
    <div class="section" id="sec-bigo-all">
      <div class="sec-title">📌 특이사항 (비고) <span class="badge" id="cnt-bigo-all">0건</span></div>
      <div class="bigo-list" id="list-bigo-all"></div>
    </div>

    <div class="updated" id="updated-a"></div>
  </div>
</div>

<script>
const PW = "dawon2026";
let DATA = [], curR = '', curA = '';

function tryLogin() {
  if (document.getElementById('pw-input').value === PW) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
  }
}

async function initApp() {
  const res = await fetch('data.json');
  DATA = await res.json();
  curR = DATA[DATA.length-1].key;
  curA = DATA[DATA.length-1].key;
  buildTabs('tabs-report', 'R');
  buildTabs('tabs-all',    'A');
  renderReport();
  renderAll();
}

/* ── 페이지 전환 ── */
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
}

/* ── 탭 ── */
function buildTabs(wrapId, mode) {
  const wrap = document.getElementById(wrapId);
  wrap.innerHTML = '';
  DATA.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'wtab';
    btn.textContent = w.key + ' (' + w.label + ')';
    btn.onclick = () => {
      if (mode==='R') { curR = w.key; renderReport(); }
      else            { curA = w.key; renderAll();    }
      wrap.querySelectorAll('.wtab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    if ((mode==='R' && w.key===curR)||(mode==='A' && w.key===curA))
      btn.classList.add('active');
    wrap.appendChild(btn);
  });
}

/* ── 유틸 ── */
const EXCL = ['휴무','취소됨','시공취소','대체공휴일',''];
const HOL  = ['휴무','대체공휴일'];
function validRows(rows) { return rows.filter(r => !EXCL.includes(r.team)); }
function fmt(n)  { return Number(n).toLocaleString('ko-KR'); }
function fmtM(n) { return (n/10000).toFixed(0)+'만'; }
function getWeek(key) { return DATA.find(w=>w.key===key)||{rows:[],bigo:[]}; }

/* ── 보고 페이지 렌더 ── */
function renderReport() {
  const w     = getWeek(curR);
  const rows  = w.rows;
  const valid = validRows(rows);

  // 요약
  const tc = valid.reduce((s,r)=>s+r.contract,0);
  const tp = valid.reduce((s,r)=>s+r.profit,0);
  const uc = valid.filter(r=>r.paid&&r.paid.includes('미수')).length;
  const cc = rows.filter(r=>['취소됨','시공취소'].includes(r.team)).length;
  document.getElementById('summary-cards').innerHTML = `
    <div class="card"><div class="card-label">총 계약금액</div><div class="card-value">${fmtM(tc)}</div></div>
    <div class="card"><div class="card-label">총 수익</div><div class="card-value green">${fmtM(tp)}</div></div>
    <div class="card"><div class="card-label">시공 건수</div><div class="card-value">${valid.length}건</div></div>
    <div class="card"><div class="card-label">미수 건수</div><div class="card-value ${uc?'orange':''}">${uc}건</div></div>
    <div class="card"><div class="card-label">취소 건수</div><div class="card-value ${cc?'red':''}">${cc}건</div></div>
    <div class="card"><div class="card-label">수익률</div><div class="card-value">${tc>0?(tp/tc*100).toFixed(1):0}%</div></div>
  `;

  // 미수
  const unpaid = valid.filter(r=>r.paid&&r.paid.includes('미수'));
  document.getElementById('cnt-unpaid').textContent = unpaid.length+'건';
  document.getElementById('list-unpaid').innerHTML = unpaid.length
    ? unpaid.map(r=>`<div class="alert-item">
        <div class="alert-icon">💰</div>
        <div class="alert-text">
          <strong>[${r.team}] ${r.name}</strong>
          시공일: ${r.sdate} &nbsp;|&nbsp; 계약: ${fmt(r.contract)}원 &nbsp;|&nbsp; 수익: ${fmt(r.profit)}원
          ${r.paid&&r.paid!=='미수'?'<br>완납현황: '+r.paid:''}
          ${r.memo?'<br>비고: '+r.memo:''}
        </div></div>`).join('')
    : '<div class="empty-msg">미수 건 없음</div>';

  // 취소
  const cancelled = rows.filter(r=>['취소됨','시공취소'].includes(r.team));
  document.getElementById('cnt-cancel').textContent = cancelled.length+'건';
  document.getElementById('list-cancel').innerHTML = cancelled.length
    ? cancelled.map(r=>`<div class="alert-item cancel">
        <div class="alert-icon">🚫</div>
        <div class="alert-text">
          <strong>[취소] ${r.name}</strong>
          시공일: ${r.sdate} &nbsp;|&nbsp; 계약: ${fmt(r.contract)}원
          ${r.memo?'<br>비고: '+r.memo:''}
        </div></div>`).join('')
    : '<div class="empty-msg">취소 건 없음</div>';

  // 특이사항
  renderBigo(w.bigo, 'cnt-bigo', 'list-bigo');

  // 주간 상세 테이블
  renderTableTo(rows, 'tbody-report', 'cnt-report-table');
  document.getElementById('updated-r').textContent = '최종 업데이트: '+new Date().toLocaleDateString('ko-KR');
}

/* ── 전체 내역 렌더 ── */
function renderAll() {
  const w    = getWeek(curA);
  const rows = w.rows;
  renderTableTo(rows, 'tbody-all', 'cnt-all');

  // 특이사항
  renderBigo(w.bigo, 'cnt-bigo-all', 'list-bigo-all');
  document.getElementById('updated-a').textContent = '최종 업데이트: '+new Date().toLocaleDateString('ko-KR');
}

/* ── 테이블 공통 렌더 ── */
function renderTableTo(rows, tbodyId, cntId) {
  document.getElementById(cntId).textContent = rows.length+'건';
  const teamClass = t => {
    if (t==='시공1팀') return 'team-시공1팀';
    if (t==='이엘이')  return 'team-이엘이';
    if (t==='척척박사') return 'team-척척박사';
    if (['취소됨','시공취소'].includes(t)) return 'team-취소됨';
    if (t==='KY공조')  return 'team-KY공조';
    if (t==='류부원장') return 'team-류부원장';
    return '';
  };

  document.getElementById(tbodyId).innerHTML = rows.map(r => {
    const isHol = HOL.includes(r.team);
    let paidTag = '';
    if (['취소됨','시공취소'].includes(r.team))
      paidTag = '<span class="tag tag-취소">취소</span>';
    else if (r.paid) {
      if (r.paid.includes('미수')) paidTag = '<span class="tag tag-미수">미수</span>';
      else if (r.paid.includes('완납')) paidTag = '<span class="tag tag-완납">완납</span>';
      else paidTag = `<span style="font-size:11px">${r.paid}</span>`;
    }
    const profitStyle = r.profit<0 ? 'color:#c62828' : '';
    return `<tr class="${teamClass(r.team)}${isHol?' row-holiday':''}">
      <td class="l">${r.team}</td>
      <td class="l">${r.name}</td>
      <td class="c" style="white-space:nowrap">${r.sdate}</td>
      <td class="c">${r.indoor||'-'}</td>
      <td class="r num">${r.contract?fmt(r.contract):'-'}</td>
      <td class="r num">${r.product?fmt(r.product):'-'}</td>
      <td class="r num">${r.labor?fmt(r.labor):'-'}</td>
      <td class="r num">${r.paint_cost?fmt(r.paint_cost):'-'}</td>
      <td class="r num">${r.material?fmt(r.material):'-'}</td>
      <td class="r num" style="${profitStyle}">${r.profit?fmt(r.profit):'-'}</td>
      <td class="l">${paidTag}</td>
    </tr>`;
  }).join('');
}

/* ── 특이사항 공통 렌더 ── */
function renderBigo(bigo, cntId, listId) {
  document.getElementById(cntId).textContent = (bigo||[]).length+'건';
  const el = document.getElementById(listId);
  if (!bigo||!bigo.length) {
    el.innerHTML = '<div class="empty-msg">특이사항 없음</div>'; return;
  }
  el.innerHTML = bigo.map(b=>`
    <div class="bigo-item">
      <div class="bigo-who">[${b.team}] ${b.name} <span style="font-weight:400;color:#666;font-size:12px">${b.sdate}</span></div>
      <div class="bigo-memo">${b.memo}</div>
    </div>`).join('');
}
</script>
</body>
</html>
